<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>1v1 Battle Builder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { display: block; }
#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; color: white;
}
/* ── Player HUD (bottom-left) ── */
#p1-hud {
  position: absolute; bottom: 20px; left: 20px;
  display: flex; flex-direction: column; gap: 6px;
}
/* ── Bot HUD (top-right) ── */
#bot-hud {
  position: absolute; top: 16px; right: 20px;
  display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
}
.health-bar-bg {
  width: 180px; height: 13px;
  background: rgba(0,0,0,0.5);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 7px; overflow: hidden;
}
.health-bar { height: 100%; transition: width 0.15s; }
.player-name { font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
.build-slots { display: flex; gap: 4px; }
.slot {
  width: 36px; height: 36px; background: rgba(0,0,0,0.55);
  border: 2px solid rgba(255,255,255,0.3); border-radius: 5px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; font-size: 9px; gap: 1px;
}
.slot.active { border-color: #FFD700; background: rgba(255,215,0,0.2); }
.slot-icon { font-size: 14px; }
#ammo1 { font-size: 11px; background: rgba(0,0,0,0.55); padding: 2px 7px; border-radius: 4px; }
/* ── Controls card ── */
#ctrl-card {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 7px 11px; border-radius: 7px;
  font-size: 10px; line-height: 1.75;
  border: 1px solid rgba(255,255,255,0.2);
}
/* ── Bot label ── */
#bot-label {
  font-size: 11px; background: rgba(180,0,0,0.55);
  padding: 2px 8px; border-radius: 4px;
}
/* ── Winner screen ── */
#winner-screen {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.75);
  justify-content: center; align-items: center;
  flex-direction: column; pointer-events: all;
}
#winner-screen h1 { font-size: 52px; color: #FFD700; text-shadow: 0 0 30px #FFD700; margin-bottom: 16px; }
#winner-screen button {
  font-size: 22px; padding: 12px 36px; cursor: pointer;
  background: #e74c3c; color: white; border: none; border-radius: 8px;
}
#winner-screen button:hover { background: #c0392b; }
/* ── Crosshair ── */
#crosshair {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 20px; height: 20px; pointer-events: none;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.85);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="crosshair"></div>

  <div id="ctrl-card">
    <b style="color:#5B9BD5">Du (Blau)</b><br>
    WASD: Bewegen &nbsp;|&nbsp; Shift: Sprinten<br>
    Q / R: Kamera drehen<br>
    1 / 2 / 3 / 4: Baumodus &nbsp;|&nbsp; E: Bauen<br>
    F: Schießen
  </div>

  <!-- Bot HUD top-right -->
  <div id="bot-hud">
    <div class="player-name" style="color:#E05252">&#9673; Bot</div>
    <div id="bot-label">🤖 KI-Gegner</div>
    <div class="health-bar-bg">
      <div class="health-bar" id="p2-health" style="width:100%; background:#e74c3c;"></div>
    </div>
  </div>

  <!-- Player HUD bottom-left -->
  <div id="p1-hud">
    <div class="player-name" style="color:#5B9BD5">&#9673; Du</div>
    <div class="health-bar-bg">
      <div class="health-bar" id="p1-health" style="width:100%; background:#2ecc71;"></div>
    </div>
    <div class="build-slots">
      <div class="slot" id="p1-s1"><span class="slot-icon">🟫</span><span>Boden</span></div>
      <div class="slot" id="p1-s2"><span class="slot-icon">🧱</span><span>Wand</span></div>
      <div class="slot" id="p1-s3"><span class="slot-icon">📐</span><span>Trep.</span></div>
      <div class="slot" id="p1-s4"><span class="slot-icon">🏠</span><span>Dach</span></div>
    </div>
    <div id="ammo1">Munition: ∞</div>
  </div>

  <div id="winner-screen">
    <h1 id="winner-text">Du gewinnst!</h1>
    <button onclick="restartGame()">🔄 Nochmal spielen</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// ── RENDERER ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0xADD8E6, 0.006);

// ── LIGHTING ──────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfffde7, 1.1);
sun.position.set(40, 90, 30);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top  =  120; sun.shadow.camera.bottom = -120;
sun.shadow.camera.far  = 300;
scene.add(sun);

// ── GROUND ────────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(320, 320, 64, 64);
const posArr = groundGeo.attributes.position.array;
for (let i = 0; i < posArr.length; i += 3) posArr[i + 2] += (Math.random() - 0.5) * 0.15;
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x4CAF50 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

for (let i = 0; i < 30; i++) {
  const p = new THREE.Mesh(
    new THREE.CircleGeometry(Math.random() * 9 + 3, 8),
    new THREE.MeshLambertMaterial({ color: 0x388E3C })
  );
  p.rotation.x = -Math.PI / 2;
  p.position.set((Math.random() - 0.5) * 250, 0.01, (Math.random() - 0.5) * 250);
  scene.add(p);
}

function addTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.5, 4, 7),
    new THREE.MeshLambertMaterial({ color: 0x6D4C41 })
  );
  trunk.position.set(x, 2, z); trunk.castShadow = true;
  scene.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(2.8 + Math.random(), 5 + Math.random() * 2, 7),
    new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x2E7D32 : 0x388E3C })
  );
  leaves.position.set(x, 7 + Math.random(), z); leaves.castShadow = true;
  scene.add(leaves);
}
for (let i = 0; i < 35; i++) {
  let tx, tz;
  do { tx = (Math.random() - 0.5) * 200; tz = (Math.random() - 0.5) * 200; }
  while (Math.abs(tx) < 18 && Math.abs(tz) < 18);
  addTree(tx, tz);
}
for (let i = 0; i < 15; i++) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(Math.random() * 1.2 + 0.5, 0),
    new THREE.MeshLambertMaterial({ color: 0x9E9E9E })
  );
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.position.set((Math.random() - 0.5) * 180, 0.4, (Math.random() - 0.5) * 180);
  rock.castShadow = true; rock.receiveShadow = true;
  scene.add(rock);
}

// ── CAMERA ────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

// ── BUILDING ──────────────────────────────────────────────────────────────
const CELL = 4;
const buildings = new Map();

function snapGrid(v) { return Math.round(v / CELL) * CELL; }

function placeBuilding(type, px, pz, facingAngle) {
  const fx = Math.sin(facingAngle) * CELL * 0.9;
  const fz = Math.cos(facingAngle) * CELL * 0.9;
  const gx = snapGrid(px + fx);
  const gz = snapGrid(pz + fz);
  const key = `${type}_${gx}_${gz}`;
  if (buildings.has(key)) return;

  let obj;
  if (type === 3) {
    const grp = new THREE.Group();
    const sm = new THREE.MeshLambertMaterial({ color: 0xA1887F });
    for (let s = 0; s < 4; s++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(CELL - 0.1, 0.3, CELL / 4 - 0.05), sm);
      step.position.set(0, s * 1.05, (s - 1.5) * CELL / 4);
      step.castShadow = true; step.receiveShadow = true;
      grp.add(step);
    }
    grp.position.set(gx, 0.15, gz);
    grp.rotation.y = facingAngle;
    obj = grp;
  } else {
    const defs = {
      1: { color:0x795548, geo:new THREE.BoxGeometry(CELL-0.1,0.3,CELL-0.1), oy:0.15 },
      2: { color:0xBCAAA4, geo:new THREE.BoxGeometry(CELL-0.1,CELL,0.3),     oy:CELL/2 },
      4: { color:0x6D4C41, geo:new THREE.BoxGeometry(CELL-0.1,0.3,CELL-0.1), oy:0.15 },
    };
    const d = defs[type];
    const mesh = new THREE.Mesh(d.geo, new THREE.MeshLambertMaterial({ color: d.color }));
    mesh.position.set(gx, d.oy, gz);
    if (type === 2) mesh.rotation.y = facingAngle;
    mesh.castShadow = true; mesh.receiveShadow = true;
    obj = mesh;
  }
  scene.add(obj);
  buildings.set(key, obj);
}

// ── HUMANOID ──────────────────────────────────────────────────────────────
function createHumanoid(bodyColor, pantsColor) {
  const g = new THREE.Group();
  const skin  = new THREE.MeshLambertMaterial({ color: 0xFFCBA4 });
  const body  = new THREE.MeshLambertMaterial({ color: bodyColor });
  const pants = new THREE.MeshLambertMaterial({ color: pantsColor });
  const shoes = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  const hair  = new THREE.MeshLambertMaterial({ color: 0x4E342E });
  const eyeM  = new THREE.MeshLambertMaterial({ color: 0x1565C0 });

  function add(geo, mat, x, y, z) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
  }

  const legG  = new THREE.BoxGeometry(0.32, 0.9, 0.32);
  const legL  = add(legG, pants, -0.2, 0.45, 0);
  const legR  = add(legG, pants,  0.2, 0.45, 0);
  g.userData.legL = legL; g.userData.legR = legR;

  const shoeG = new THREE.BoxGeometry(0.33, 0.15, 0.42);
  add(shoeG, shoes, -0.2, 0.075, 0.05);
  add(shoeG, shoes,  0.2, 0.075, 0.05);

  add(new THREE.BoxGeometry(0.88, 0.85, 0.44), body, 0, 1.12, 0);

  const armG  = new THREE.BoxGeometry(0.27, 0.78, 0.27);
  const armL  = add(armG, body, -0.58, 1.1, 0);
  const armR  = add(armG, body,  0.58, 1.1, 0);
  g.userData.armL = armL; g.userData.armR = armR;

  // gun
  const gunGrp = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.52), new THREE.MeshLambertMaterial({ color: 0x212121 }));
  barrel.position.set(0, 0, 0.26);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.1), new THREE.MeshLambertMaterial({ color: 0x263238 }));
  grip.position.set(0, -0.1, 0.08);
  gunGrp.add(barrel); gunGrp.add(grip);
  gunGrp.position.set(0.58, 1.1, 0.15);
  g.add(gunGrp); g.userData.gun = gunGrp;

  add(new THREE.BoxGeometry(0.68, 0.72, 0.68), skin, 0, 1.68, 0);
  add(new THREE.BoxGeometry(0.7,  0.22, 0.7),  hair, 0, 2.03, 0);
  add(new THREE.BoxGeometry(0.08, 0.22, 0.22), skin, -0.38, 1.68, 0);
  add(new THREE.BoxGeometry(0.08, 0.22, 0.22), skin,  0.38, 1.68, 0);
  add(new THREE.BoxGeometry(0.13, 0.09, 0.05), eyeM, -0.17, 1.69, 0.35);
  add(new THREE.BoxGeometry(0.13, 0.09, 0.05), eyeM,  0.17, 1.69, 0.35);
  add(new THREE.BoxGeometry(0.07, 0.07, 0.08), skin, 0, 1.60, 0.37);
  add(new THREE.BoxGeometry(0.2,  0.04, 0.05), new THREE.MeshLambertMaterial({ color: 0xbf8060 }), 0, 1.52, 0.36);

  return g;
}

// ── BULLETS ───────────────────────────────────────────────────────────────
const bulletGeo = new THREE.SphereGeometry(0.1, 5, 5);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xFFFF44 });
let bullets = [];

class Bullet {
  constructor(pos, angle, ownerId) {
    this.ownerId = ownerId;
    this.angle   = angle;
    this.life    = 90;
    this.mesh    = new THREE.Mesh(bulletGeo, bulletMat);
    this.mesh.position.copy(pos);
    scene.add(this.mesh);
    // muzzle flash
    const flash = new THREE.Mesh(new THREE.SphereGeometry(0.25,5,5), new THREE.MeshBasicMaterial({ color:0xFF8800 }));
    flash.position.copy(pos);
    scene.add(flash);
    setTimeout(() => scene.remove(flash), 55);
  }
  update(allPlayers) {
    this.mesh.position.x += Math.sin(this.angle) * 1.1;
    this.mesh.position.z += Math.cos(this.angle) * 1.1;
    this.life--;
    for (const pl of allPlayers) {
      if (pl.id === this.ownerId || pl.isDead) continue;
      if (this.mesh.position.distanceTo(pl.mesh.position) < 1.3) {
        pl.takeDamage(25);
        this.life = 0;
        break;
      }
    }
    if (this.life <= 0) { scene.remove(this.mesh); return false; }
    return true;
  }
}

// ── PLAYER ────────────────────────────────────────────────────────────────
let players  = [];
let gameOver = false;

class Player {
  constructor(id, bodyColor, pantsColor, startX, startZ) {
    this.id        = id;
    this.health    = 100;
    this.isDead    = false;
    this.buildMode = 0;
    this.facing    = id === 1 ? Math.PI : 0;
    this.shootCD   = 0;
    this.buildCD   = 0;
    this.walkT     = 0;
    this.camAngleY = 0;

    this.mesh = createHumanoid(bodyColor, pantsColor);
    this.mesh.position.set(startX, 0, startZ);
    this.mesh.rotation.y = this.facing;
    scene.add(this.mesh);
  }

  move(dx, dz, sprint) {
    if (this.isDead) return;
    if (dx !== 0 || dz !== 0) {
      const angle = Math.atan2(dx, dz) + this.camAngleY;
      this.facing = angle;
      this.mesh.rotation.y = angle;
      const spd = 0.13 * (sprint ? 1.9 : 1);
      this.mesh.position.x = Math.max(-145, Math.min(145, this.mesh.position.x + Math.sin(angle) * spd));
      this.mesh.position.z = Math.max(-145, Math.min(145, this.mesh.position.z + Math.cos(angle) * spd));
      this.walkT += 0.18 * (sprint ? 1.9 : 1);
      const sw = Math.sin(this.walkT) * 0.45;
      this.mesh.userData.legL.rotation.x =  sw;
      this.mesh.userData.legR.rotation.x = -sw;
      this.mesh.userData.armL.rotation.x = -sw * 0.6;
      this.mesh.userData.armR.rotation.x =  sw * 0.6;
    } else {
      this.mesh.userData.legL.rotation.x *= 0.75;
      this.mesh.userData.legR.rotation.x *= 0.75;
      this.mesh.userData.armL.rotation.x *= 0.75;
      this.mesh.userData.armR.rotation.x *= 0.75;
    }
  }

  shoot() {
    if (this.shootCD > 0 || this.isDead) return;
    const sp = this.mesh.position.clone(); sp.y = 1.1;
    bullets.push(new Bullet(sp, this.facing, this.id));
    this.shootCD = 22;
    this.mesh.userData.armR.rotation.x = -0.5;
  }

  build(type) {
    if (this.buildCD > 0 || this.isDead || type < 1 || type > 4) return;
    placeBuilding(type, this.mesh.position.x, this.mesh.position.z, this.facing);
    this.buildCD = 18;
  }

  takeDamage(amount) {
    this.health = Math.max(0, this.health - amount);
    document.getElementById('p' + this.id + '-health').style.width = this.health + '%';
    if (this.health <= 0 && !this.isDead) {
      this.isDead = true;
      this.mesh.rotation.z = Math.PI / 2;
      this.mesh.position.y = -0.3;
      endGame(this.id === 1 ? 'Bot' : 'Du');
    }
  }

  tick() {
    if (this.shootCD > 0) this.shootCD--;
    if (this.buildCD  > 0) this.buildCD--;
  }
}

// ── BOT AI ────────────────────────────────────────────────────────────────
let botProvoked = false; // bot only fights after player shoots first

class Bot extends Player {
  constructor() {
    super(2, 0xB71C1C, 0x263238, 22, 0);
    this.state      = 'idle';  // idle | chase | strafe | build | retreat
    this.stateTimer = 0;
    this.strafeDir  = 1;
    this.buildTimer = 0;
  }

  updateAI(target) {
    if (this.isDead || target.isDead) return;

    const dx   = target.mesh.position.x - this.mesh.position.x;
    const dz   = target.mesh.position.z - this.mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    const angleToPlayer = Math.atan2(dx, dz);

    // Always face the player
    this.facing = angleToPlayer;
    this.mesh.rotation.y = angleToPlayer;

    // While not provoked: stand still, do nothing
    if (!botProvoked) {
      this.tick();
      return;
    }

    // ── Provoked behaviour ────────────────────────────────────────────────
    this.stateTimer--;
    if (this.stateTimer <= 0) {
      const r = Math.random();
      if (dist > 28)               { this.state = 'chase';   this.stateTimer = 80; }
      else if (r < 0.35)           { this.state = 'strafe';  this.stateTimer = 60; this.strafeDir = Math.random() < 0.5 ? 1 : -1; }
      else if (r < 0.50 && this.health < 55) { this.state = 'retreat'; this.stateTimer = 50; }
      else if (r < 0.62)           { this.state = 'build';   this.stateTimer = 40; }
      else                         { this.state = 'chase';   this.stateTimer = 80; }
    }

    let moveDx = 0, moveDz = 0;

    if (this.state === 'chase') {
      moveDx = dx / dist;
      moveDz = dz / dist;
    } else if (this.state === 'strafe') {
      moveDx =  (dz / dist) * this.strafeDir;
      moveDz = -(dx / dist) * this.strafeDir;
    } else if (this.state === 'retreat') {
      moveDx = -(dx / dist);
      moveDz = -(dz / dist);
    } else if (this.state === 'build') {
      this.buildTimer--;
      if (this.buildTimer <= 0) {
        this.build(Math.random() < 0.65 ? 2 : 1);
        this.buildTimer = 20;
      }
    }

    // Don't crowd the player
    if (dist < 9 && this.state !== 'retreat') {
      moveDx -= dx / dist * 0.5;
      moveDz -= dz / dist * 0.5;
    }

    this.camAngleY = 0;
    const len = Math.sqrt(moveDx * moveDx + moveDz * moveDz);
    // Bot speed is 0.07 (about half the player's 0.13), no sprinting
    if (len > 0) {
      const angle = Math.atan2(moveDx, moveDz);
      this.mesh.rotation.y = this.facing; // keep facing player
      const spd = 0.07;
      this.mesh.position.x = Math.max(-145, Math.min(145, this.mesh.position.x + Math.sin(angle) * spd));
      this.mesh.position.z = Math.max(-145, Math.min(145, this.mesh.position.z + Math.cos(angle) * spd));
      this.walkT += 0.1;
      const sw = Math.sin(this.walkT) * 0.4;
      this.mesh.userData.legL.rotation.x =  sw;
      this.mesh.userData.legR.rotation.x = -sw;
    } else {
      this.mesh.userData.legL.rotation.x *= 0.75;
      this.mesh.userData.legR.rotation.x *= 0.75;
    }

    // Shoot when in range — slower fire rate than player
    if (dist < 38 && this.shootCD <= 0 && !this.isDead) {
      const inaccuracy = 0.15;
      const aimAngle = angleToPlayer + (Math.random() - 0.5) * inaccuracy * 2;
      const sp = this.mesh.position.clone(); sp.y = 1.1;
      bullets.push(new Bullet(sp, aimAngle, this.id));
      this.shootCD = 45 + Math.floor(Math.random() * 25); // slower than player (22)
      this.mesh.userData.armR.rotation.x = -0.5;
    }

    this.tick();
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

// ── CAMERA UPDATE ─────────────────────────────────────────────────────────
let camAngleY = 0;

function updateCamera(player) {
  // Q / R to rotate camera
  if (keys['KeyQ']) camAngleY -= 0.03;
  if (keys['KeyR']) camAngleY += 0.03;
  player.camAngleY = camAngleY;

  const px = player.mesh.position.x;
  const pz = player.mesh.position.z;
  const dist = 9, pitch = 0.42;
  const cx = px - Math.sin(camAngleY) * dist * Math.cos(pitch);
  const cz = pz - Math.cos(camAngleY) * dist * Math.cos(pitch);
  const cy = player.mesh.position.y + dist * Math.sin(pitch) + 0.8;
  camera.position.set(cx, cy, cz);
  camera.lookAt(px, player.mesh.position.y + 1.5, pz);
}

// ── GAME MANAGEMENT ───────────────────────────────────────────────────────
function endGame(winnerName) {
  gameOver = true;
  const ws = document.getElementById('winner-screen');
  ws.style.display = 'flex';
  document.getElementById('winner-text').textContent =
    winnerName === 'Du' ? '🏆 Du gewinnst!' : '💀 Bot gewinnt!';
}

function restartGame() {
  bullets.forEach(b => scene.remove(b.mesh));
  bullets = [];
  buildings.forEach(b => scene.remove(b));
  buildings.clear();
  players.forEach(p => scene.remove(p.mesh));
  players = [];
  camAngleY = 0;
  botProvoked = false;
  document.getElementById('winner-screen').style.display = 'none';
  gameOver = false;
  initGame();
}

let bot;

function initGame() {
  const human = new Player(1, 0x1565C0, 0x37474F, -22, 0);
  bot = new Bot();
  players = [human, bot];

  // reset health bars
  document.getElementById('p1-health').style.width = '100%';
  document.getElementById('p2-health').style.width = '100%';

  // reset build slots
  for (let i = 1; i <= 4; i++)
    document.getElementById('p1-s' + i).classList.remove('active');
}

// ── RESIZE ────────────────────────────────────────────────────────────────
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  if (gameOver) { renderer.render(scene, camera); return; }

  const human = players[0];

  // ── Human input ──
  let dx = 0, dz = 0;
  if (keys['KeyA']) dx -= 1;
  if (keys['KeyD']) dx += 1;
  if (keys['KeyW']) dz -= 1;
  if (keys['KeyS']) dz += 1;
  human.move(dx, dz, keys['ShiftLeft']);

  // build mode
  for (let i = 1; i <= 4; i++) {
    if (keys['Digit' + i]) {
      human.buildMode = (human.buildMode === i) ? 0 : i;
      keys['Digit' + i] = false;
      for (let j = 1; j <= 4; j++)
        document.getElementById('p1-s' + j).classList.toggle('active', human.buildMode === j);
    }
  }
  if (keys['KeyE'] && human.buildMode > 0) {
    human.build(human.buildMode);
    keys['KeyE'] = false;
  }
  if (keys['KeyF']) {
    human.shoot();
    botProvoked = true; // bot starts fighting after first shot
    keys['KeyF'] = false;
  }
  human.tick();

  // ── Bot AI ──
  document.getElementById('bot-label').textContent = botProvoked ? '🤖 Kämpft!' : '🤖 Wartet...';
  bot.updateAI(human);

  // ── Bullets ──
  bullets = bullets.filter(b => b.update(players));

  // ── Camera ──
  updateCamera(human);

  renderer.render(scene, camera);
}

initGame();
loop();
</script>
