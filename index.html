<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>1v1 Battle Builder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { display: block; }
#ui {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; color: white;
}
/* ── Player HUD (bottom-left) ── */
#p1-hud {
  position: absolute; bottom: 20px; left: 20px;
  display: flex; flex-direction: column; gap: 6px;
}
/* ── Bot HUD (top-right) ── */
#bot-hud {
  position: absolute; top: 16px; right: 20px;
  display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
}
.health-bar-bg {
  width: 180px; height: 13px;
  background: rgba(0,0,0,0.5);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 7px; overflow: hidden;
}
.health-bar { height: 100%; transition: width 0.15s; }
.player-name { font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
.build-slots { display: flex; gap: 4px; }
.slot {
  width: 36px; height: 36px; background: rgba(0,0,0,0.55);
  border: 2px solid rgba(255,255,255,0.3); border-radius: 5px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; font-size: 9px; gap: 1px;
}
.slot.active { border-color: #FFD700; background: rgba(255,215,0,0.2); }
.slot-icon { font-size: 14px; }
#ammo1 { font-size: 11px; background: rgba(0,0,0,0.55); padding: 2px 7px; border-radius: 4px; }
/* ── Controls card ── */
#ctrl-card {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 7px 11px; border-radius: 7px;
  font-size: 10px; line-height: 1.75;
  border: 1px solid rgba(255,255,255,0.2);
}
/* ── Bot label ── */
#bot-label {
  font-size: 11px; background: rgba(180,0,0,0.55);
  padding: 2px 8px; border-radius: 4px;
}
/* ── Winner screen ── */
#winner-screen {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.75);
  justify-content: center; align-items: center;
  flex-direction: column; pointer-events: all;
}
#winner-screen h1 { font-size: 52px; color: #FFD700; text-shadow: 0 0 30px #FFD700; margin-bottom: 16px; }
#winner-screen button {
  font-size: 22px; padding: 12px 36px; cursor: pointer;
  background: #e74c3c; color: white; border: none; border-radius: 8px;
}
#winner-screen button:hover { background: #c0392b; }
/* ── Crosshair ── */
#lock-hint {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.45); pointer-events: none;
}
#lock-box {
  background: rgba(0,0,0,0.75); color: white;
  padding: 18px 32px; border-radius: 10px;
  font-size: 18px; text-align: center; line-height: 1.8;
  border: 1px solid rgba(255,255,255,0.3);
}
#crosshair {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 20px; height: 20px; pointer-events: none;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.85);
}
#crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="crosshair"></div>
  <div id="lock-hint">
    <div id="lock-box">🖱️ Klicke um Maus zu sperren<br><small>ESC = freigeben</small></div>
  </div>

  <div id="ctrl-card">
    <b style="color:#5B9BD5">Du (Blau)</b><br>
    WASD: Bewegen &nbsp;|&nbsp; Shift: Sprinten<br>
    Maus: Umsehen<br>
    1 / 2 / 3 / 4: Baumodus &nbsp;|&nbsp; E: Bauen<br>
    Linksklick / F: Schießen
  </div>

  <!-- Bot HUD top-right -->
  <div id="bot-hud">
    <div class="player-name" style="color:#E05252">&#9673; Bot</div>
    <div id="bot-label">🤖 KI-Gegner</div>
    <div class="health-bar-bg">
      <div class="health-bar" id="p2-health" style="width:100%; background:#e74c3c;"></div>
    </div>
  </div>

  <!-- Player HUD bottom-left -->
  <div id="p1-hud">
    <div class="player-name" style="color:#5B9BD5">&#9673; Du</div>
    <div class="health-bar-bg">
      <div class="health-bar" id="p1-health" style="width:100%; background:#2ecc71;"></div>
    </div>
    <div class="build-slots">
      <div class="slot" id="p1-s1"><span class="slot-icon">🟫</span><span>Boden</span></div>
      <div class="slot" id="p1-s2"><span class="slot-icon">🧱</span><span>Wand</span></div>
      <div class="slot" id="p1-s3"><span class="slot-icon">📐</span><span>Trep.</span></div>
      <div class="slot" id="p1-s4"><span class="slot-icon">🏠</span><span>Dach</span></div>
    </div>
    <div id="ammo1">Munition: ∞</div>
  </div>

  <div id="secret-hint" style="display:none; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.75); color:#FFD700; font-size:20px; padding:16px 28px;
    border-radius:10px; border:1px solid #FFD700; text-align:center; transition:opacity 2s;">
    🔓 Geheimer Raum geöffnet — lauf zu Koordinate (55, 55)!
  </div>

  <div id="winner-screen">
    <h1 id="winner-text">💀 Bot gewinnt!</h1>
    <button onclick="restartGame()">🔄 Nochmal spielen</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// ── RENDERER ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.012);

// ── LIGHTING (night) ──────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2040, 0.6));

// dim moonlight
const moon = new THREE.DirectionalLight(0x4466bb, 0.35);
moon.position.set(-30, 80, -20);
moon.castShadow = true;
moon.shadow.mapSize.width = 2048; moon.shadow.mapSize.height = 2048;
moon.shadow.camera.left = -120; moon.shadow.camera.right = 120;
moon.shadow.camera.top  =  120; moon.shadow.camera.bottom = -120;
moon.shadow.camera.far  = 300;
scene.add(moon);

// stars
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 1200; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const r = 280;
  starVerts.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));

// moon sphere in sky
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xddeeff }));
moonMesh.position.set(-120, 180, -160);
scene.add(moonMesh);

// ── GROUND ────────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(320, 320, 64, 64);
const posArr = groundGeo.attributes.position.array;
for (let i = 0; i < posArr.length; i += 3) posArr[i + 2] += (Math.random() - 0.5) * 0.15;
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x1a3320 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

for (let i = 0; i < 30; i++) {
  const p = new THREE.Mesh(
    new THREE.CircleGeometry(Math.random() * 9 + 3, 8),
    new THREE.MeshLambertMaterial({ color: 0x1b2e1b })
  );
  p.rotation.x = -Math.PI / 2;
  p.position.set((Math.random() - 0.5) * 250, 0.01, (Math.random() - 0.5) * 250);
  scene.add(p);
}

// ── STREETS ───────────────────────────────────────────────────────────────
const roadMat  = new THREE.MeshLambertMaterial({ color: 0x222222 });
const lineMat  = new THREE.MeshLambertMaterial({ color: 0xdddd00 });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x555566 });

// Road grid: streets every 40 units from -120 to 120
const ROAD_W = 8;
const streetPositions = [-80, -40, 0, 40, 80];

for (const s of streetPositions) {
  // horizontal road (along X)
  const rh = new THREE.Mesh(new THREE.PlaneGeometry(280, ROAD_W), roadMat);
  rh.rotation.x = -Math.PI / 2; rh.position.set(0, 0.02, s);
  scene.add(rh);
  // vertical road (along Z)
  const rv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, 280), roadMat);
  rv.rotation.x = -Math.PI / 2; rv.position.set(s, 0.02, 0);
  scene.add(rv);

  // dashed center line horizontal
  for (let x = -130; x < 130; x += 8) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.2), lineMat);
    dash.rotation.x = -Math.PI / 2; dash.position.set(x, 0.03, s);
    scene.add(dash);
  }
  // dashed center line vertical
  for (let z = -130; z < 130; z += 8) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 4), lineMat);
    dash.rotation.x = -Math.PI / 2; dash.position.set(s, 0.03, z);
    scene.add(dash);
  }
  // sidewalks
  for (const side of [-1, 1]) {
    const swH = new THREE.Mesh(new THREE.PlaneGeometry(280, 1.5), sidewalkMat);
    swH.rotation.x = -Math.PI / 2; swH.position.set(0, 0.025, s + side * (ROAD_W/2 + 0.75));
    scene.add(swH);
    const swV = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 280), sidewalkMat);
    swV.rotation.x = -Math.PI / 2; swV.position.set(s + side * (ROAD_W/2 + 0.75), 0.025, 0);
    scene.add(swV);
  }
}

// ── STREET LAMPS ──────────────────────────────────────────────────────────
function addLamp(x, z) {
  // pole
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.15, 7, 6),
    new THREE.MeshLambertMaterial({ color: 0x444444 })
  );
  pole.position.set(x, 3.5, z);
  pole.castShadow = true;
  scene.add(pole);

  // arm
  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.1, 1.4),
    new THREE.MeshLambertMaterial({ color: 0x444444 })
  );
  arm.position.set(x, 7.1, z - 0.7);
  scene.add(arm);

  // lamp head
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.3, 0.9),
    new THREE.MeshLambertMaterial({ color: 0x333333 })
  );
  head.position.set(x, 6.9, z - 1.3);
  scene.add(head);

  // glowing bulb
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xFFEE99 })
  );
  bulb.position.set(x, 6.75, z - 1.3);
  scene.add(bulb);

  // point light (warm yellow)
  const light = new THREE.PointLight(0xFFCC55, 1.8, 22);
  light.position.set(x, 6.5, z - 1.3);
  scene.add(light);
}

// place lamps along every street every 20 units
for (const s of streetPositions) {
  for (let t = -120; t <= 120; t += 20) {
    addLamp(t, s + ROAD_W/2 + 1.8);
    addLamp(s + ROAD_W/2 + 1.8, t);
  }
}

// ── HOUSES ────────────────────────────────────────────────────────────────
const houseColors = [0x8D6E63, 0x78909C, 0xA1887F, 0x7986CB, 0x4DB6AC, 0xF06292];
const roofColors  = [0xb71c1c, 0x4a148c, 0x1a237e, 0x1b5e20, 0x37474F];

function addHouse(x, z, ry) {
  const w = 7 + Math.floor(Math.random() * 5);
  const d = 6 + Math.floor(Math.random() * 4);
  const h = 4 + Math.floor(Math.random() * 4);
  const col  = houseColors[Math.floor(Math.random() * houseColors.length)];
  const rcol = roofColors [Math.floor(Math.random() * roofColors.length)];

  const grp = new THREE.Group();
  grp.position.set(x, 0, z);
  grp.rotation.y = ry || 0;

  // walls
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ color: col })
  );
  walls.position.y = h / 2;
  walls.castShadow = true; walls.receiveShadow = true;
  grp.add(walls);

  // roof (prism shape via scaled box)
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.max(w, d) * 0.72, 3, 4),
    new THREE.MeshLambertMaterial({ color: rcol })
  );
  roof.position.y = h + 1.5;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  grp.add(roof);

  // door
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 2.0, 0.1),
    new THREE.MeshLambertMaterial({ color: 0x4E342E })
  );
  door.position.set(0, 1.0, d / 2 + 0.05);
  grp.add(door);

  // windows
  const winMat = new THREE.MeshBasicMaterial({ color: 0xFFEE88 }); // lit windows at night
  const winPositions = [
    [-w/2 + 1.5, h*0.6, d/2 + 0.05],
    [ w/2 - 1.5, h*0.6, d/2 + 0.05],
    [-w/2 - 0.05, h*0.6, 0],
    [ w/2 + 0.05, h*0.6, 0],
  ];
  for (const [wx, wy, wz] of winPositions) {
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0), winMat);
    win.position.set(wx, wy, wz);
    if (Math.abs(wz) < 0.1) win.rotation.y = Math.PI / 2;
    grp.add(win);
    // subtle warm glow from window
    const wl = new THREE.PointLight(0xFFCC44, 0.4, 8);
    wl.position.set(wx, wy, wz);
    grp.add(wl);
  }

  scene.add(grp);
}

// Place houses in blocks between streets (avoid roads ±5 and spawn/secret room area)
function isOnRoad(x, z) {
  for (const s of streetPositions) {
    if (Math.abs(x - s) < ROAD_W/2 + 3) return true;
    if (Math.abs(z - s) < ROAD_W/2 + 3) return true;
  }
  return false;
}

// fill blocks
for (let bx = -110; bx <= 110; bx += 40) {
  for (let bz = -110; bz <= 110; bz += 40) {
    // each block: up to 4 houses
    const offsets = [[-8,-8],[8,-8],[-8,8],[8,8]];
    for (const [ox, oz] of offsets) {
      const hx = bx + ox + (Math.random()-0.5)*4;
      const hz = bz + oz + (Math.random()-0.5)*4;
      // skip start area, spawn, secret room
      if (Math.abs(hx) < 25 && Math.abs(hz) < 10) continue;
      if (Math.abs(hx - 55) < 15 && Math.abs(hz - 55) < 15) continue;
      if (isOnRoad(hx, hz)) continue;
      addHouse(hx, hz, Math.floor(Math.random()*4) * Math.PI/2);
    }
  }
}

function addTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.5, 4, 7),
    new THREE.MeshLambertMaterial({ color: 0x6D4C41 })
  );
  trunk.position.set(x, 2, z); trunk.castShadow = true;
  scene.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(2.8 + Math.random(), 5 + Math.random() * 2, 7),
    new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x1a3322 : 0x0d1f11 })
  );
  leaves.position.set(x, 7 + Math.random(), z); leaves.castShadow = true;
  scene.add(leaves);
}
for (let i = 0; i < 35; i++) {
  let tx, tz;
  do { tx = (Math.random() - 0.5) * 200; tz = (Math.random() - 0.5) * 200; }
  while (Math.abs(tx) < 18 && Math.abs(tz) < 18);
  addTree(tx, tz);
}
for (let i = 0; i < 15; i++) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(Math.random() * 1.2 + 0.5, 0),
    new THREE.MeshLambertMaterial({ color: 0x9E9E9E })
  );
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.position.set((Math.random() - 0.5) * 180, 0.4, (Math.random() - 0.5) * 180);
  rock.castShadow = true; rock.receiveShadow = true;
  scene.add(rock);
}

// ── CAMERA ────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

// ── BUILDING ──────────────────────────────────────────────────────────────
const CELL = 4;
const buildings = new Map();

function snapGrid(v) { return Math.round(v / CELL) * CELL; }

function placeBuilding(type, px, pz, facingAngle) {
  const fx = Math.sin(facingAngle) * CELL * 0.9;
  const fz = Math.cos(facingAngle) * CELL * 0.9;
  const gx = snapGrid(px + fx);
  const gz = snapGrid(pz + fz);
  const key = `${type}_${gx}_${gz}`;
  if (buildings.has(key)) return;

  let obj;
  if (type === 3) {
    const grp = new THREE.Group();
    const sm = new THREE.MeshLambertMaterial({ color: 0xA1887F });
    for (let s = 0; s < 4; s++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(CELL - 0.1, 0.3, CELL / 4 - 0.05), sm);
      step.position.set(0, s * 1.05, (s - 1.5) * CELL / 4);
      step.castShadow = true; step.receiveShadow = true;
      grp.add(step);
    }
    grp.position.set(gx, 0.15, gz);
    grp.rotation.y = facingAngle;
    obj = grp;
  } else {
    const defs = {
      1: { color:0x795548, geo:new THREE.BoxGeometry(CELL-0.1,0.3,CELL-0.1), oy:0.15 },
      2: { color:0xBCAAA4, geo:new THREE.BoxGeometry(CELL-0.1,CELL,0.3),     oy:CELL/2 },
      4: { color:0x6D4C41, geo:new THREE.BoxGeometry(CELL-0.1,0.3,CELL-0.1), oy:0.15 },
    };
    const d = defs[type];
    const mesh = new THREE.Mesh(d.geo, new THREE.MeshLambertMaterial({ color: d.color }));
    mesh.position.set(gx, d.oy, gz);
    if (type === 2) mesh.rotation.y = facingAngle;
    mesh.castShadow = true; mesh.receiveShadow = true;
    obj = mesh;
  }
  scene.add(obj);
  buildings.set(key, obj);
}

// ── HUMANOID ──────────────────────────────────────────────────────────────
function createHumanoid(bodyColor, pantsColor) {
  const g = new THREE.Group();
  const skin  = new THREE.MeshLambertMaterial({ color: 0xFFCBA4 });
  const body  = new THREE.MeshLambertMaterial({ color: bodyColor });
  const pants = new THREE.MeshLambertMaterial({ color: pantsColor });
  const shoes = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  const hair  = new THREE.MeshLambertMaterial({ color: 0x4E342E });
  const eyeM  = new THREE.MeshLambertMaterial({ color: 0x1565C0 });

  function add(geo, mat, x, y, z) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
  }

  const legG  = new THREE.BoxGeometry(0.32, 0.9, 0.32);
  const legL  = add(legG, pants, -0.2, 0.45, 0);
  const legR  = add(legG, pants,  0.2, 0.45, 0);
  g.userData.legL = legL; g.userData.legR = legR;

  const shoeG = new THREE.BoxGeometry(0.33, 0.15, 0.42);
  add(shoeG, shoes, -0.2, 0.075, 0.05);
  add(shoeG, shoes,  0.2, 0.075, 0.05);

  add(new THREE.BoxGeometry(0.88, 0.85, 0.44), body, 0, 1.12, 0);

  const armG  = new THREE.BoxGeometry(0.27, 0.78, 0.27);
  const armL  = add(armG, body, -0.58, 1.1, 0);
  const armR  = add(armG, body,  0.58, 1.1, 0);
  g.userData.armL = armL; g.userData.armR = armR;

  // gun
  const gunGrp = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.52), new THREE.MeshLambertMaterial({ color: 0x212121 }));
  barrel.position.set(0, 0, 0.26);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.1), new THREE.MeshLambertMaterial({ color: 0x263238 }));
  grip.position.set(0, -0.1, 0.08);
  gunGrp.add(barrel); gunGrp.add(grip);
  gunGrp.position.set(0.58, 1.1, 0.15);
  g.add(gunGrp); g.userData.gun = gunGrp;

  add(new THREE.BoxGeometry(0.68, 0.72, 0.68), skin, 0, 1.68, 0);
  add(new THREE.BoxGeometry(0.7,  0.22, 0.7),  hair, 0, 2.03, 0);
  add(new THREE.BoxGeometry(0.08, 0.22, 0.22), skin, -0.38, 1.68, 0);
  add(new THREE.BoxGeometry(0.08, 0.22, 0.22), skin,  0.38, 1.68, 0);
  add(new THREE.BoxGeometry(0.13, 0.09, 0.05), eyeM, -0.17, 1.69, 0.35);
  add(new THREE.BoxGeometry(0.13, 0.09, 0.05), eyeM,  0.17, 1.69, 0.35);
  add(new THREE.BoxGeometry(0.07, 0.07, 0.08), skin, 0, 1.60, 0.37);
  add(new THREE.BoxGeometry(0.2,  0.04, 0.05), new THREE.MeshLambertMaterial({ color: 0xbf8060 }), 0, 1.52, 0.36);

  return g;
}

// ── BULLETS ───────────────────────────────────────────────────────────────
const bulletGeo = new THREE.SphereGeometry(0.1, 5, 5);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xFFFF44 });
let bullets = [];

class Bullet {
  constructor(pos, angle, ownerId) {
    this.ownerId = ownerId;
    this.angle   = angle;
    this.life    = 90;
    this.mesh    = new THREE.Mesh(bulletGeo, bulletMat);
    this.mesh.position.copy(pos);
    scene.add(this.mesh);
    // muzzle flash
    const flash = new THREE.Mesh(new THREE.SphereGeometry(0.25,5,5), new THREE.MeshBasicMaterial({ color:0xFF8800 }));
    flash.position.copy(pos);
    scene.add(flash);
    setTimeout(() => scene.remove(flash), 55);
  }
  update(allPlayers) {
    this.mesh.position.x += Math.sin(this.angle) * 1.1;
    this.mesh.position.z += Math.cos(this.angle) * 1.1;
    this.life--;
    for (const pl of allPlayers) {
      if (pl.id === this.ownerId || pl.isDead) continue;
      if (this.mesh.position.distanceTo(pl.mesh.position) < 1.3) {
        pl.takeDamage(25);
        this.life = 0;
        break;
      }
    }
    if (this.life <= 0) { scene.remove(this.mesh); return false; }
    return true;
  }
}

// ── PLAYER ────────────────────────────────────────────────────────────────
let players  = [];
let gameOver = false;

class Player {
  constructor(id, bodyColor, pantsColor, startX, startZ) {
    this.id        = id;
    this.health    = 100;
    this.isDead    = false;
    this.buildMode = 0;
    this.facing    = id === 1 ? Math.PI : 0;
    this.shootCD   = 0;
    this.buildCD   = 0;
    this.walkT     = 0;
    this.camAngleY = 0;

    this.mesh = createHumanoid(bodyColor, pantsColor);
    this.mesh.position.set(startX, 0, startZ);
    this.mesh.rotation.y = this.facing;
    scene.add(this.mesh);
  }

  move(dx, dz, sprint) {
    if (this.isDead) return;
    if (dx !== 0 || dz !== 0) {
      const angle = Math.atan2(dx, dz) + this.camAngleY;
      this.facing = angle;
      this.mesh.rotation.y = angle;
      const spd = 0.13 * (sprint ? 1.9 : 1);
      this.mesh.position.x = Math.max(-145, Math.min(145, this.mesh.position.x + Math.sin(angle) * spd));
      this.mesh.position.z = Math.max(-145, Math.min(145, this.mesh.position.z + Math.cos(angle) * spd));
      this.walkT += 0.18 * (sprint ? 1.9 : 1);
      const sw = Math.sin(this.walkT) * 0.45;
      this.mesh.userData.legL.rotation.x =  sw;
      this.mesh.userData.legR.rotation.x = -sw;
      this.mesh.userData.armL.rotation.x = -sw * 0.6;
      this.mesh.userData.armR.rotation.x =  sw * 0.6;
    } else {
      // Always face the direction the camera looks, even when standing still
      this.facing = this.camAngleY;
      this.mesh.rotation.y = this.camAngleY;
      this.mesh.userData.legL.rotation.x *= 0.75;
      this.mesh.userData.legR.rotation.x *= 0.75;
      this.mesh.userData.armL.rotation.x *= 0.75;
      this.mesh.userData.armR.rotation.x *= 0.75;
    }
  }

  shoot() {
    if (this.shootCD > 0 || this.isDead) return;
    const sp = this.mesh.position.clone(); sp.y = 1.1;
    bullets.push(new Bullet(sp, this.facing, this.id));
    this.shootCD = 22;
    this.mesh.userData.armR.rotation.x = -0.5;
  }

  build(type) {
    if (this.buildCD > 0 || this.isDead || type < 1 || type > 4) return;
    placeBuilding(type, this.mesh.position.x, this.mesh.position.z, this.facing);
    this.buildCD = 18;
  }

  takeDamage(amount) {
    this.health = Math.max(0, this.health - amount);
    document.getElementById('p' + this.id + '-health').style.width = this.health + '%';
    if (this.health <= 0 && !this.isDead) {
      this.isDead = true;
      this.mesh.rotation.z = Math.PI / 2;
      this.mesh.position.y = -0.3;
      endGame(this.id === 1 ? 'Bot' : 'Du');
    }
  }

  tick() {
    if (this.shootCD > 0) this.shootCD--;
    if (this.buildCD  > 0) this.buildCD--;
  }
}

// ── BOT AI ────────────────────────────────────────────────────────────────
let botProvoked = false; // bot only fights after player shoots first

class Bot extends Player {
  constructor() {
    super(2, 0xB71C1C, 0x263238, 22, 0);
    this.state      = 'idle';  // idle | chase | strafe | build | retreat
    this.stateTimer = 0;
    this.strafeDir  = 1;
    this.buildTimer = 0;
  }

  updateAI(target) {
    if (this.isDead || target.isDead) return;

    const dx   = target.mesh.position.x - this.mesh.position.x;
    const dz   = target.mesh.position.z - this.mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    const angleToPlayer = Math.atan2(dx, dz);

    // Always face the player
    this.facing = angleToPlayer;
    this.mesh.rotation.y = angleToPlayer;

    // While not provoked: stand still, do nothing
    if (!botProvoked) {
      this.tick();
      return;
    }

    // ── Provoked behaviour ────────────────────────────────────────────────
    this.stateTimer--;
    if (this.stateTimer <= 0) {
      const r = Math.random();
      if (dist > 28)               { this.state = 'chase';   this.stateTimer = 80; }
      else if (r < 0.35)           { this.state = 'strafe';  this.stateTimer = 60; this.strafeDir = Math.random() < 0.5 ? 1 : -1; }
      else if (r < 0.50 && this.health < 55) { this.state = 'retreat'; this.stateTimer = 50; }
      else if (r < 0.62)           { this.state = 'build';   this.stateTimer = 40; }
      else                         { this.state = 'chase';   this.stateTimer = 80; }
    }

    let moveDx = 0, moveDz = 0;

    if (this.state === 'chase') {
      moveDx = dx / dist;
      moveDz = dz / dist;
    } else if (this.state === 'strafe') {
      moveDx =  (dz / dist) * this.strafeDir;
      moveDz = -(dx / dist) * this.strafeDir;
    } else if (this.state === 'retreat') {
      moveDx = -(dx / dist);
      moveDz = -(dz / dist);
    } else if (this.state === 'build') {
      this.buildTimer--;
      if (this.buildTimer <= 0) {
        this.build(Math.random() < 0.65 ? 2 : 1);
        this.buildTimer = 20;
      }
    }

    // Don't crowd the player
    if (dist < 9 && this.state !== 'retreat') {
      moveDx -= dx / dist * 0.5;
      moveDz -= dz / dist * 0.5;
    }

    this.camAngleY = 0;
    const len = Math.sqrt(moveDx * moveDx + moveDz * moveDz);
    // Bot speed is 0.07 (about half the player's 0.13), no sprinting
    if (len > 0) {
      const angle = Math.atan2(moveDx, moveDz);
      this.mesh.rotation.y = this.facing; // keep facing player
      const spd = 0.07;
      this.mesh.position.x = Math.max(-145, Math.min(145, this.mesh.position.x + Math.sin(angle) * spd));
      this.mesh.position.z = Math.max(-145, Math.min(145, this.mesh.position.z + Math.cos(angle) * spd));
      this.walkT += 0.1;
      const sw = Math.sin(this.walkT) * 0.4;
      this.mesh.userData.legL.rotation.x =  sw;
      this.mesh.userData.legR.rotation.x = -sw;
    } else {
      this.mesh.userData.legL.rotation.x *= 0.75;
      this.mesh.userData.legR.rotation.x *= 0.75;
    }

    // Shoot when in range — slower fire rate than player
    if (dist < 38 && this.shootCD <= 0 && !this.isDead) {
      const inaccuracy = 0.15;
      const aimAngle = angleToPlayer + (Math.random() - 0.5) * inaccuracy * 2;
      const sp = this.mesh.position.clone(); sp.y = 1.1;
      bullets.push(new Bullet(sp, aimAngle, this.id));
      this.shootCD = 45 + Math.floor(Math.random() * 25); // slower than player (22)
      this.mesh.userData.armR.rotation.x = -0.5;
    }

    this.tick();
  }
}

// ── INPUT ─────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });
window.addEventListener('mousedown', e => {
  if (e.button === 0) {
    if (!document.pointerLockElement) {
      canvas.requestPointerLock();
    } else {
      keys['KeyF'] = true;
    }
  }
});
window.addEventListener('mouseup', e => { if (e.button === 0) keys['KeyF'] = false; });

document.addEventListener('pointerlockchange', () => {
  document.getElementById('lock-hint').style.display =
    document.pointerLockElement ? 'none' : 'flex';
});

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement) {
    camAngleY += e.movementX * 0.003;
  }
});

// ── SECRET ROOM ───────────────────────────────────────────────────────────
const ROOM_X = 55, ROOM_Z = 55; // room center
let secretDoor = null;

function buildSecretRoom() {
  const stone = new THREE.MeshLambertMaterial({ color: 0x546E7A });
  const dark  = new THREE.MeshLambertMaterial({ color: 0x37474F });
  const W = 12, H = 7; // room width/height

  function wall(w, h, d, x, y, z, ry) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stone);
    m.position.set(x, y, z);
    if (ry) m.rotation.y = ry;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
  }

  // floor
  const floorM = new THREE.Mesh(new THREE.BoxGeometry(W, 0.4, W), new THREE.MeshLambertMaterial({ color: 0x455A64 }));
  floorM.position.set(ROOM_X, 0.2, ROOM_Z);
  floorM.receiveShadow = true;
  scene.add(floorM);

  // ceiling
  wall(W, 0.4, W, ROOM_X, H, ROOM_Z);

  // back wall
  wall(W, H, 0.4, ROOM_X, H/2, ROOM_Z - W/2);
  // left wall
  wall(0.4, H, W, ROOM_X - W/2, H/2, ROOM_Z);
  // right wall
  wall(0.4, H, W, ROOM_X + W/2, H/2, ROOM_Z);

  // front wall — two halves with a door gap in the middle
  wall(4, H, 0.4, ROOM_X - 4, H/2, ROOM_Z + W/2);
  wall(4, H, 0.4, ROOM_X + 4, H/2, ROOM_Z + W/2);
  // door lintel above gap
  wall(4, H - 4.5, 0.4, ROOM_X, H - (H - 4.5)/2, ROOM_Z + W/2);

  // door itself (removed when bot dies)
  secretDoor = new THREE.Mesh(new THREE.BoxGeometry(4, 4.5, 0.4), dark);
  secretDoor.position.set(ROOM_X, 2.25, ROOM_Z + W/2);
  secretDoor.castShadow = true;
  scene.add(secretDoor);

  // interior point light
  const roomLight = new THREE.PointLight(0xFFD700, 1.5, 20);
  roomLight.position.set(ROOM_X, H - 1, ROOM_Z);
  scene.add(roomLight);

  // glowing lamp mesh
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xFFFF99 }));
  lamp.position.set(ROOM_X, H - 0.6, ROOM_Z);
  scene.add(lamp);

  // sign with canvas texture
  const signCanvas = document.createElement('canvas');
  signCanvas.width = 512; signCanvas.height = 256;
  const ctx = signCanvas.getContext('2d');

  // background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 8;
  ctx.strokeRect(8, 8, 496, 240);

  // stars
  ctx.fillStyle = '#FFD700';
  for (let i = 0; i < 12; i++) {
    ctx.font = '20px Arial';
    ctx.fillText('⭐', 20 + i * 40, 40);
  }

  // main text
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('NOEL', 256, 110);

  ctx.fillStyle = '#ffffff';
  ctx.font = '28px Arial';
  ctx.fillText('hat dieses Spiel gemacht', 256, 155);

  ctx.fillStyle = '#aaaaaa';
  ctx.font = '22px Arial';
  ctx.fillText('❤️ Danke fürs Spielen ❤️', 256, 200);

  // bottom stars
  ctx.fillStyle = '#FFD700';
  for (let i = 0; i < 12; i++) {
    ctx.font = '20px Arial';
    ctx.fillText('⭐', 20 + i * 40, 240);
  }

  const tex = new THREE.CanvasTexture(signCanvas);
  const signMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 4),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
  );
  signMesh.position.set(ROOM_X, 3.5, ROOM_Z - W/2 + 0.5);
  scene.add(signMesh);

  // small sign outside hinting at secret
  const hintCanvas = document.createElement('canvas');
  hintCanvas.width = 256; hintCanvas.height = 64;
  const hctx = hintCanvas.getContext('2d');
  hctx.fillStyle = '#b71c1c';
  hctx.fillRect(0, 0, 256, 64);
  hctx.fillStyle = '#ffffff';
  hctx.font = 'bold 22px Arial';
  hctx.textAlign = 'center';
  hctx.fillText('🔒 GEHEIMER RAUM', 128, 40);
  const hintTex = new THREE.CanvasTexture(hintCanvas);
  const hintSign = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 1),
    new THREE.MeshBasicMaterial({ map: hintTex, side: THREE.DoubleSide })
  );
  hintSign.position.set(ROOM_X, 5.5, ROOM_Z + W/2 + 0.3);
  scene.add(hintSign);
}

function openSecretDoor() {
  if (!secretDoor) return;
  // animate door sliding up
  let t = 0;
  const startY = secretDoor.position.y;
  const interval = setInterval(() => {
    t += 0.05;
    secretDoor.position.y = startY + t * 12;
    if (t >= 1) {
      scene.remove(secretDoor);
      secretDoor = null;
      clearInterval(interval);
    }
  }, 16);
}

// ── CAMERA UPDATE ─────────────────────────────────────────────────────────
let camAngleY = 0;
let camAngleX = 0.42; // vertical pitch (start slightly above)

function updateCamera(player) {
  player.camAngleY = camAngleY;

  const px = player.mesh.position.x;
  const py = player.mesh.position.y;
  const pz = player.mesh.position.z;
  const dist = 9;
  const cx = px - Math.sin(camAngleY) * dist * Math.cos(camAngleX);
  const cz = pz - Math.cos(camAngleY) * dist * Math.cos(camAngleX);
  const cy = py + dist * Math.sin(camAngleX) + 0.8;
  camera.position.set(cx, cy, cz);

  // look-at target shifts up/down with pitch
  const lookY = py + 1.5 + Math.sin(camAngleX) * 6;
  camera.lookAt(px, lookY, pz);

  // tilt player head up/down to match vertical look
  const head = player.mesh.children.find(
    c => c.geometry && Math.abs(c.geometry.parameters.width - 0.68) < 0.01
  );
  if (head) head.rotation.x = -camAngleX * 0.8;
}

// ── GAME MANAGEMENT ───────────────────────────────────────────────────────
function endGame(winnerName) {
  gameOver = true;
  if (winnerName === 'Du') {
    openSecretDoor();
    // small temporary hint then fades
    const hint = document.getElementById('secret-hint');
    hint.style.display = 'block';
    setTimeout(() => hint.style.opacity = '0', 4000);
    setTimeout(() => { hint.style.display = 'none'; hint.style.opacity = '1'; gameOver = false; }, 6000);
  } else {
    // bot wins: show restart button only
    document.getElementById('winner-screen').style.display = 'flex';
  }
}

function restartGame() {
  bullets.forEach(b => scene.remove(b.mesh));
  bullets = [];
  buildings.forEach(b => scene.remove(b));
  buildings.clear();
  players.forEach(p => scene.remove(p.mesh));
  players = [];
  camAngleY = 0;
  camAngleX = 0.42;
  botProvoked = false;
  document.getElementById('winner-screen').style.display = 'none';
  document.getElementById('secret-hint').style.display = 'none';
  gameOver = false;
  initGame();
}

let bot;

function initGame() {
  buildSecretRoom();
  const human = new Player(1, 0x1565C0, 0x37474F, -22, 0);
  bot = new Bot();
  players = [human, bot];

  // reset health bars
  document.getElementById('p1-health').style.width = '100%';
  document.getElementById('p2-health').style.width = '100%';

  // reset build slots
  for (let i = 1; i <= 4; i++)
    document.getElementById('p1-s' + i).classList.remove('active');
}

// ── RESIZE ────────────────────────────────────────────────────────────────
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── MAIN LOOP ─────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  if (gameOver) { renderer.render(scene, camera); return; }

  const human = players[0];

  // ── Human input ──
  let dx = 0, dz = 0;
  if (keys['KeyA']) dx -= 1;
  if (keys['KeyD']) dx += 1;
  if (keys['KeyW']) dz -= 1;
  if (keys['KeyS']) dz += 1;
  human.move(dx, dz, keys['ShiftLeft']);

  // build mode
  for (let i = 1; i <= 4; i++) {
    if (keys['Digit' + i]) {
      human.buildMode = (human.buildMode === i) ? 0 : i;
      keys['Digit' + i] = false;
      for (let j = 1; j <= 4; j++)
        document.getElementById('p1-s' + j).classList.toggle('active', human.buildMode === j);
    }
  }
  if (keys['KeyE'] && human.buildMode > 0) {
    human.build(human.buildMode);
    keys['KeyE'] = false;
  }
  if (keys['KeyF']) {
    human.shoot();
    botProvoked = true; // bot starts fighting after first shot
    keys['KeyF'] = false;
  }
  human.tick();

  // ── Bot AI ──
  document.getElementById('bot-label').textContent = botProvoked ? '🤖 Kämpft!' : '🤖 Wartet...';
  bot.updateAI(human);

  // ── Bullets ──
  bullets = bullets.filter(b => b.update(players));

  // ── Camera ──
  updateCamera(human);

  renderer.render(scene, camera);
}

initGame();
loop();
</script>
